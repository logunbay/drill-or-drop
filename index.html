<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drill or Drop: The Delta Basin Licence Round</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ec;--card:#fffdf9;--ink:#1d2430;--muted:#5b6472;--line:#ddd6c9;--accent:#c4621d;--deep:#14213d;--ok:#2f7d5b;--bad:#a83232;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--deep);color:#f5f2ec;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:700}
header small{color:#c9d1dd;display:block;font-weight:400;font-size:13px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 9px;border-radius:999px;background:#25355c;color:#c9d1dd}
.steps span.on{background:var(--accent);color:#fff}.steps span.done{background:var(--ok);color:#fff}
main{max-width:1200px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:880px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
h2{font-size:20px;margin:0 0 6px}h3{font-size:16px;margin:16px 0 6px}
.kicker{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:600}
svg{width:100%;height:auto;display:block}
.mentor{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--deep);color:#f0a04b;display:grid;place-items:center;font-weight:700}
.bubble{background:#eef2f7;border-radius:12px;padding:11px 13px;font-size:15px}
.fb-good{background:#e5f4e4}.fb-mid{background:#f9eeda}.fb-bad{background:#fbebeb}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;text-align:left}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{cursor:default;opacity:.85}
button.pick{border:2px solid var(--accent);background:#fff6ee}
.primary{background:var(--accent);color:#fff;border:none;text-align:center;font-weight:600}
.primary:hover:not(:disabled){background:#a9521a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{background:transparent;color:#f5f2ec;border:1px solid #5a6a8e;padding:6px 11px;font-size:13px}
textarea,input[type=text],select{font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);padding:9px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:60px;resize:vertical}
.ask{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.ask label,.small{font-size:13px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;flex:none}
.chk.bought{background:#eef6ee}
.video{background:var(--deep);color:#c9d1dd;border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.video .play{width:32px;height:32px;border-radius:50%;background:#f0a04b;color:var(--deep);display:grid;place-items:center;font-weight:700;flex:none}
.blk,.loc{cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.rt td,.rt th{text-align:center}.rt td:first-child,.rt th:first-child{text-align:left}
.c-ok{color:var(--ok);font-weight:700}.c-bad{color:var(--bad);font-weight:700}.c-unk{color:#9aa4b1;font-weight:700}
.emv,.info,.team{background:#f3eee5;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.emv b{font-size:18px}
.team ul{margin:4px 0 0;padding-left:18px}.team li{margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{padding:7px 11px;font-size:14px}
.member{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.hidden{display:none}
</style>
</head>
<body>

  <div><h1 id="appTitle"></h1><small id="teamLine">An AI-mentored exploration experience · fictional basin, real lessons</small></div>

ue, "Trap": true, "Seal": true, "Charge": true}, "fatalFlaw": null, "flawText": null, "free": {"Source": "Regional source mature here", "Reservoir": "Shelf-edge sands on trend"}, "result": null}, {"id": "D-7", "name": "D-7 · Upper slope, Osprey East", "waterDepth": "450 m", "play": "Textbook four-way 'turtle' structure", "resourceMMboe": 200, "valuePerBoe": 3, "wellCostM": 70, "expertCoS": 0.1, "rivalBidM": 20, "mapRect": [370, 205, 120, 85], "truth": {"Source": true, "Reservoir": true, "Trap": true, "Seal": true, "Charge": false}, "fatalFlaw": "Charge", "flawText": "carrier bed is a low, so oil migrates away", "free": {"Source": "Regional source mature", "Reservoir": "Slope fans on 2D", "Trap": "Perfect four-way on 2D", "Seal": "Regional marine shale"}, "result": {"key": "dry", "title": "Dry: perfect trap, no charge", "sands": [0.2, 0.2, 0.2, 0.2], "text": "The trap is exactly as mapped, the sands are excellent, and they're full of water. The carrier bed under the turtle is a low, so the oil climbed away toward the diapir, into D-5."}}, {"id": "D-9", "name": "D-9 · Shelf edge rollover", "waterDepth": "80 m", "play": "Rollover on a small growth fault", "resourceMMboe": 90, "valuePerBoe": 3, "wellCostM": 55, "expertCoS": 0.1, "rivalBidM": 10, "mapRect": [190, 105, 130, 85], "truth": {"Source": true, "Reservoir": true, "Trap": true, "Seal": false, "Charge": true}, "fatalFlaw": "Seal", "flawText": "fault throw smaller than sand thickness", "free": {"Source": "Regional source mature", "Reservoir": "Stacked shelf-edge sands", "Trap": "Rollover closure on 2D"}, "result": {"key": "dry", "title": "Leaked: residual oil, thin gas", "sands": [0.5, 0.2, 0.2, 0.2], "text": "Oil was here: you can see residual oil staining. But the fault throw is smaller than the sand, so sand sat against sand and the column leaked out through the relay zone."}}, {"id": "D-11", "name": "D-11 · Deep basin floor", "waterDepth": "1,800 m", "play": "Huge closure beyond the diapir", "resourceMMboe": 40 "text": "Distal shale; sands pinch out before the basin floor"}}}}, {"id": "geochem", "title": "Seabed geochemistry (seeps) survey", "costM": 1.2, "kind": "Survey", "reveals": {"D-5": {"Charge": {"ok": true, "text": "Oil seeps above the structure"}}, "D-9": {"Charge": {"ok": true, "text": "Oil seeps nearby"}}, "D-7": {"Charge": {"ok": false, "text": "No seeps over the structure"}}, "D-11": {"Source": {"ok": true, "text": "Gas-only seeps"}}}}], "bid": {"cosOptionsPct": [10, 20, 30, 50], "bonusOptionsM": [5, 25, 110]}, "wellPlacement": {"block": "D-5", "locations": [{"id": "L1", "x": 300, "y": 125, "points": 1, "feedback": "L1 is on the crest, but right beside the fault and under the gas cloud. Bold, and risky."}, {"id": "L2", "x": 225, "y": 172, "points": 3, "feedback": "L2 is in the biggest upthrown block, on a seismic line, away from the fault. You give up a little height for a clean answer."}, {"id": "L3", "x": 330, "y": 66, "points": 0, "feedback": "L3 is on the downthrown side of the fault. That's outside the trap."}], "outcomes": {"L1": {"key": "marg", "title": "Marginal: thin gas over oil", "sands": [0.5, 0.5, 0.5, 0], "text": "Right block, risky spot. Near the fault the sands are thin and the column is gassy. About 40 ft of net pay.", "points": 1}, "L2": {"key": "disc", "title": "Discovery: three stacked oil sands", "sands": [1, 1, 1, 0], "text": "About 120 ft of net oil pay in three sands. The fourth sand shaled out at the channel margin, so even the right block came in below the pre-drill model.", "points": 3}, "L3": {"key": "dry", "title": "Dry: outside the trap", "sands": [0.2, 0.2, 0.2, 0.2], "text": "Good sands, all water-wet. You drilled across the fault.", "points": 0}}}, "events": [{"when": "Month 2", "text": "Oil price falls from $80 to $55 a barrel"}, {"when": "Month 4", "text": "A neighbour's well 8 km east is dry"}, {"when": "Month 6", "text": "A larger operator offers $25M cash for your block. Answer in two weeks."}], "decisions": {"disc": [{"text": "Appraise now with two wells, 100% funded", "points": 2, "feedback": "Bold, and you keep everything, but you carry the full risk while the price is falling."}, {"text": "Farm down 50% to a partner who pays for appraisal", "points": 3, "feedback": "The experienced call. You keep a big share, someone else funds the risk, and the neighbour's dry hole doesn't sink you."}, {"text": "Accept the $25M cash offer", "points": 0, "feedback": "The buyer offers because they see value you're about to give away."}, {"text": "Wait and study for a year", "points": 1, "feedback": "Cheap, but the licence clock runs and the buyer may walk."}], "marg": [{"text": "Appraise now, 100% funded", "points": 1, "feedback": "Expensive for a thin, gassy result at a falling price."}, {"text": "Farm down 50% for an appraisal carry", "points": 3, "feedback": "Good. Let a partner fund the test of whether the flank holds thicker oil."}, {"text": "Accept the $25M cash offer", "points": 1, "feedback": "Not crazy, but you may be selling the flank cheaply."}, {"text": "Wait for fault-seal and pressure studies", "points": 2, "feedback": "Sensible. Know whether the fault holds before spending more."}], "dry": [{"text": "Drill a second well on the same structure", "points": 0, "feedback": "The data told you why it failed. A second well won't fix the fatal flaw."}, {"text": "Relinquish and bid for D-5 in the next round", "points": 3, "feedback": "Right. Your dry hole proved the reservoir and the migration story. Take that knowledge to the block that works."}, {"text": "Sell the block for what it fetches", "points": 2, "feedback": "Reasonable, but your learning goes with it."}, {"text": "Hold and study for a year", "points": 1, "feedback": "Studying is fine, but you already know the answer."}]}, "stages": {"basin": {"video": "Reading a deltaic margin", "intro": "Welcome to the Delta Basin licence round. Five blocks are on offer. I'll tell you now: only one of them has every element working. The other four function speak(t){if(!S.voice||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,""));const vs=speechSynthesis.getVoices();const v=vs.find(v=>/en-(GB|NG|ZA)/.test(v.lang))||vs.find(v=>/^en/.test(v.lang));if(v)u.voice=v;u.pitch=.95;speechSynthesis.speak(u)}catch(e){}}

function contourPath(cx,cy,R,ph){let d="";for(let k=0;k<=72;k++){const t=k/72*Math.PI*2,r=R*(1+.09*Math.sin(3*t+ph)+.05*Math.sin(5*t+2*ph)+.03*Math.sin(9*t+ph));d+=(k?"L":"M")+(cx+r*1.75*Math.cos(t)).toFixed(1)+" "+(cy+r*Math.sin(t)).toFixed(1)}return d+"Z"}

 return `<svg viewBox="0 0 600 330" role="img" aria-label="Osprey West top-reservoir depth map in D-5, faulted rollover with candidate well locations">

<g fill="#7f8b99" opacity=".5">${Array.from({length:40},(_,k)=>`<circle cx="${285+(k*37)%75}" cy="${108+(k*23)%45}" r="2"/>`).join("")}</g>

${SC.wellPlacement.locations.map(p=>`<g class="loc" data-loc="${p.id}" tabindex="0" role="button" aria-label="Well location ${p.id}"><circle cx="${p.x}" cy="${p.y}" r="15" fill="${S.loc===p.id?'#c4621d':'#14213d'}" stroke="#fff" stroke-width="2"/><text x="${p.x-8}" y="${p.y+4}" font-size="11" fill="#fff" font-weight="700">${p.id}</text></g>`).join("")}
</svg>`}

function lens(x,y,w,h,fill,dash){return `<path d="M${x-w} ${y} L${x+w} ${y} Q${x} ${y+2*h} ${x-w} ${y}Z" fill="${fill}" stroke="${dash?'#8d8577':'#3a2f22'}" stroke-width="1" ${dash?'stroke-dasharray="3 3"':''}/>`}
function revealSvg(sands){
 const st=s=>s===1?["#2f7d5b",62,16,"oil sand"]:s===0.5?["#d8a45a",34,7,"thin, leaked or gassy"]:s===0.2?["#7fb0d1",60,15,"water-wet sand"]:["none",46,10,"absent: shale"];
 const panel=(x0,title,arr,pre)=>{let g=`<rect x="${x0}" y="30" width="280" height="260" fill="#e6dcc8"/>`;for(let k=0;k<7;k++)g+=`<line x1="${x0}" y1="${60+k*35}" x2="${x0+280}" y2="${62+k*35}" stroke="#cbbd9f"/>`;
  g+=`<text x="${x0}" y="20" font-size="13" font-weight="600" fill="#1d2430">${title}</text><line x1="${x0+140}" y1="30" x2="${x0+140}" y2="290" stroke="#14213d" stroke-width="2.5"/>`;
  arr.forEach((s,k)=>{const y=58+k*58;if(pre){g+=lens(x0+140,y,70,17,"#2f7d5b")+`<text x="${x0+218}" y="${y+14}" font-size="10" fill="#1d2430">Sand ${k+1}</text>`}else{const[f,w,h,l]=st(s);g+=f==="none"?lens(x0+140,y,w,h,"none",true):lens(x0+140,y,w,h,f);g+=`<text x="${x0+205}" y="${y+14}" font-size="10" fill="#1d2430">${l}</text>`}});
  return g};
 return `<svg viewBox="0 0 600 300" role="img" aria-label="Schematic cross-sections: pre-drill expected four oil sands versus post-drill result">
<rect width="600" height="300" fill="#fbf8f2"/>${panel(10,"Pre-drill: 4 shelf incised-valley sands",[1,1,1,1],true)}${panel(310,"Post-drill: what the well found",sands,false)}</svg>`}

/* ---------- mentor ---------- */
const mentor=(t,c="")=>`<div class="mentor"><div class="avatar">${esc(SC.mentor.name)}</div><div class="bubble ${c}">${t}</div></div>`;

function teamBox(stage){const tips=SC.roleTips[stage];if(!tips||!S.team.members.length)return"";return `<div class="team"><b>Team focus</b><ul>${S.team.members.map(m=>`<li><b>${esc(m.name)}</b> (${ROLE[m.role].name}): ${esc(tips[m.role])}</li>`).join("")}</ul></div>`}
function ownerPick(stage){if(S.team.members.length<2)return"";return `<p class="small" style="margin:12px 0 4px">Who on the team makes this call?</p><select id="owner_${stage}">${S.team.members.map((m,j)=>`<option value="${j}">${esc(m.name)} (${ROLE[m.role].name})</option>`).join("")}</select>`}
function recordOwner(stage){const el=$("owner_"+stage);if(el){const m=S.team.members[+el.value];S.owner[stage]=`${m.name} (${ROLE[m.role].name})`;el.disabled=true}}
function worldText(){return `${SC.setting} Blocks: ${SC.blocks.map(b=>`${b.id} (${b.play}, water ${b.waterDepth})`).join("; ")}. Only one block has all elements working; the others each hide one fatal flaw that data purchases can reveal. Team: ${S.team.members.map(m=>m.name+" as "+ROLE[m.role].name).join(", ")||"single player"}. Data bought: ${S.bought.join(", ")||"none"}. What the team currently knows: ${JSON.stringify(Object.fromEntries(SC.blocks.map(b=>[b.id,known(b.id)])))}.`}
async function ask(q,out,ctx){
 out.innerHTML=mentor("Thinking…");
 if(!sample){out.innerHTML=mentor("The live mentor isn't available in this view. In the production build, the mentor answers here using only checked course material.");return}
 const p=`You are ${SC.mentor.name}, ${SC.mentor.persona} ${worldText()}
Rules: ${SC.mentor.rules.join(" ")}
Current stage: ${ctx}. Choices so far: ${JSON.stringify(S.choices)}.
The team says: "${q}"
No markdown.`;
 try{const r=await sample(p,{modelTier:"quick",onText:({text})=>{out.innerHTML=mentor(esc(text))}});out.innerHTML=mentor(esc(r.text));speak(r.text)}
 catch(e){out.innerHTML=mentor(e&&e.code==="rate_limited"?"Lots of questions right now. Try again in a moment.":"The live mentor couldn't answer just now. Carry on.")}
}
const askBlock=()=>`<div class="ask"><label for="q">Ask the mentor or explain your reasoning</label><textarea id="q" placeholder="e.g. Which data would tell us if D-7 is charged?"></textarea><div class="err hidden" id="qerr">Type a question first.</div><div class="row" style="margin-top:8px"><button id="qbtn">Ask ${esc(SC.mentor.name)}</button></div><div id="qout"></div></div>`;
function wireAsk(ctx){const b=$("qbtn");if(!b)return;$("q").oninput=()=>$("qerr").classList.add("hidden");b.onclick=()=>{const v=$("q").value.trim();if(!v){$("qerr").classList.remove("hidden");return}ask(v,$("qout"),ctx)}}
function steps(){$("steps").innerHTML=STAGES.map((s,k)=>`<span class="${k<S.i?'done':k===S.i?'on':''}">${k+1}. ${s}</span>`).join("")}
function go(k){S.i=k;steps();window.scrollTo(0,0);try{speechSynthesis.cancel()}catch(e){}[stTeam,stBasin,stData,stScreen,stBid,stDrill,stReveal,stDecide,stDebrief][k]()}
const fbClass=p=>p===3?"fb-good":p>=1?"fb-mid":"fb-bad";

/* ---------- 0. Team ---------- */
function stTeam(){
 $("vis").innerHTML=`<div class="kicker">Delta Basin · licence round · fictional</div><h2>Five blocks. One works. Find it before you spend the money.</h2>${baseMap(false)}<p>Your team has a small data budget, one bid and one well. Every decision changes what happens next, and an experienced mentor coaches you along the way.</p><p class="small">The basin is invented. Every lesson comes from a real well.</p>`;
 $("panel").innerHTML=mentor(`Hello, I'm ${esc(SC.mentor.name)}. Set up your team first. Give each person a role: each role gets its own briefing at every stage. Playing alone? Just enter your own name.`)+
 `<h3>Your team</h3><input type="text" id="tname" placeholder="Team name" style="width:100%;margin-bottom:10px">${[0,1,2,3].map(j=>`<div class="member"><input type="text" id="mn${j}" placeholder="Member ${j+1} name${j?' (optional)':''}"><select id="mr${j}">${SC.roles.map((r,k)=>`<option value="${r.id}" ${k===j?'selected':''}>${r.name}</option>`).join("")}</select></div>`).join("")}<div class="err hidden" id="terr">Enter at least one member's name.</div><button class="primary" id="begin" style="margin-top:6px">Start the licence round</button><p class="small" style="margin-top:10px">About ${SC.durationMinutes} minutes. Switch on the mentor voice at the top if you'd like.</p>`;

/* ---------- 2. Data room ---------- */
function stData(){
 const st=SC.stages.data,B=SC.dataBudgetM;
 const draw=()=>{$("vis").innerHTML=`<div class="kicker">Stage 3 · The data room</div><h2>What we have, what we don't</h2>${riskTable()}<h3>Free data already in the room</h3><ul class="small">${SC.freeData.map(f=>`<li>${esc(f)}</li>`).join("")}</ul><div id="newinfo"></div>`};
 draw();
 $("panel").innerHTML=video(st.video)+mentor(st.intro)+teamBox("data")+`<p style="font-weight:600;margin:12px 0 6px">Data budget: <span id="bud">$${B.toFixed(1)}M left</span></p><div class="opts">${SC.dataItems.map(i=>`<label class="chk"><input type="checkbox" value="${i.id}"><span><b>${esc(i.title)}</b><br><span class="small">${i.kind} · $${i.costM}M</span></span></label>`).join("")}</div><div class="err hidden" id="derr"></div><button class="primary" id="buy">Buy selected data</button><div id="dfb"></div><div id="nextWrap"></div>`+askBlock();
 speak(st.intro);
 const boxes=[...document.querySelectorAll(".chk input")];
 const spent=()=>boxes.filter(b=>b.checked).reduce((a,b)=>a+SC.dataItems.find(i=>i.id===b.value).costM,0);
 const upd=()=>{const s=spent();$("bud").textContent=s<=B+1e-9?`$${(B-s).toFixed(1)}M left`:`Over budget by $${(s-B).toFixed(1)}M`;$("bud").style.color=s>B+1e-9?"#a83232":"";$("derr").classList.add("hidden")};
 boxes.forEach(b=>b.onchange=upd);
 $("buy").onclick=()=>{const sel=boxes.filter(b=>b.checked).map(b=>b.value);
  if(!sel.length){$("derr").textContent="Select at least one item, or ask the mentor what each one tells you.";$("derr").classList.remove("hidden");return}
  if(spent()>B+1e-9){$("derr").textContent="You're over budget. Drop an item.";$("derr").classList.remove("hidden");return}
  S.bought=sel;S.choices["Data room"]=sel.map(id=>SC.dataItems.find(i=>i.id===id).title).join("; ");
  boxes.forEach(b=>{b.disabled=true;b.closest(".chk").classList.toggle("bought",b.checked)});$("buy").disabled=true;draw();
  const notes=[];sel.forEach(id=>{const it=SC.dataItems.find(i=>i.id===id);for(const b in it.reveals)for(const e in it.reveals[b]){const r=it.reveals[b][e];notes.push(`<li><b>${b} ${e}:</b> ${r.ok?'✓':'✗'} ${esc(r.text)}</li>`)}});
  $("newinfo").innerHTML=`<h3>What your data revealed</h3><ul class="small">${notes.join("")}</ul>`;
  const f=flawsFound();S.score.data=f>=totalFlaws?3:f===totalFlaws-1?2:f>=2?1:0;
  const msg=f>=totalFlaws?"Excellent. You've uncovered every fatal flaw, and one block is left standing with no red marks. That's value of information done right.":f>=2?`You've found ${f} of the ${totalFlaws} fatal flaws. Look at the question marks that remain. One of them might be hiding the next dry hole.`:"You've spent money but learned little about the fatal flaws. Ask yourself which element is the real unknown in each block.";
  $("dfb").innerHTML=mentor(msg,fbClass(S.score.data))+`<p class="small">Fatal flaws uncovered: <b>${f} / ${totalFlaws}</b> · Points ${S.score.data}/3</p>`;
  $("nextWrap").innerHTML=`<button class="primary" id="next">Screen the blocks</button>`;$("next").onclick=()=>go(3);speak(msg)};
 wireAsk("Stage 2 data room and value of information");
}

 const st=SC.stages.screen,good=SC.blocks.find(b=>!b.fatalFlaw).id;
 $("vis").innerHTML=`<div class="kicker">Stage 4 · Screen</div><h2>Which block do we bid on?</h2>${baseMap(true)}${riskTable()}`;
 $("panel").innerHTML=mentor(st.intro)+teamBox("screen")+ownerPick("screen")+`<div class="opts" id="opts">${SC.blocks.map(b=>`<button data-b="${b.id}"><b>${b.id}</b> · ${esc(b.play)} · ~${b.resourceMMboe} MMboe</button>`).join("")}</div><div id="fb"></div><div id="nextWrap"></div>`+askBlock();

 const choose=id=>{recordOwner("screen");S.block=id;S.choices.Screen=BLK[id].name;$("vis").querySelector("svg").outerHTML=baseMap(false);
  document.querySelectorAll("#opts button").forEach(x=>{x.disabled=true;x.classList.toggle("pick",x.dataset.b===id)});
  const flaw=BLK[id].fatalFlaw,seen=flaw&&known(id)[flaw]?.v===0;

/* ---------- 4. Bid ---------- */
function stBid(){
 const x=BLK[S.block],npv=x.resourceMMboe*x.valuePerBoe,st=SC.stages.bid;
 const intro=`${st.intro} If ${S.block} works, it's worth about ${npv} million dollars to us after development and government take. A dry well costs ${x.wellCostM} million.`;
 $("vis").innerHTML=`<div class="kicker">Stage 5 · The bid</div><h2>${esc(x.name)}</h2><table><tr><th>Input</th><th>Value</th></tr><tr><td>Unrisked P50 resource</td><td>${x.resourceMMboe} MMboe</td></tr><tr><td>Value to us if successful (after tax and development)</td><td>$${x.valuePerBoe}/boe → <b>$${npv}M</b></td></tr><tr><td>Exploration well cost (lost if dry)</td><td>$${x.wellCostM}M</td></tr><tr><td>Fiscal terms</td><td>Production sharing contract; signature bonus is the bid variable</td></tr></table><div class="emv" id="emv">Pick a chance of success and a bonus to see the expected value.</div><p class="small" style="margin-top:8px">EMV = (chance of success × value if successful) − (chance of failure × dry-hole cost) − signature bonus</p>`;
 $("panel").innerHTML=video(st.video)+mentor(intro)+teamBox("bid")+`<p style="font-weight:600;margin:12px 0 6px">Your chance of success</p><div class="seg" id="cos">${SC.bid.cosOptionsPct.map(v=>`<button data-v="${v}">${v}%</button>`).join("")}</div><p style="font-weight:600;margin:14px 0 6px">Signature bonus bid</p><div class="seg" id="bid">${SC.bid.bonusOptionsM.map(v=>`<button data-v="${v}">$${v}M</button>`).join("")}</div>${ownerPick("bid")}<div class="err hidden" id="berr">Choose both a chance of success and a bid.</div><button class="primary" id="submit" style="margin-top:12px;display:block">Submit the bid</button><div id="fb"></div><div id="nextWrap"></div>`+askBlock();
 speak(intro);
 const calc=()=>{if(S.cos==null||S.bid==null)return;const c=S.cos/100,emv=c*npv-(1-c)*x.wellCostM-S.bid;$("emv").innerHTML=`Your EMV at ${S.cos}% and a $${S.bid}M bonus: <b style="color:${emv>=0?'#2f7d5b':'#a83232'}">${emv>=0?'+':''}$${emv.toFixed(0)}M</b>`};
 const seg=(sel,key)=>document.querySelectorAll(sel+" button").forEach(b=>b.onclick=()=>{S[key]=+b.dataset.v;document.querySelectorAll(sel+" button").forEach(y=>y.classList.toggle("pick",y===b));$("berr").classList.add("hidden");calc()});
 seg("#cos","cos");seg("#bid","bid");
 $("submit").onclick=()=>{if(S.cos==null||S.bid==null){$("berr").classList.remove("hidden");return}
  recordOwner("bid");document.querySelectorAll("#cos button,#bid button,#submit").forEach(y=>y.disabled=true);
  const rival=x.rivalBidM,win=S.bid>rival,trueEmv=x.expertCoS*npv-(1-x.expertCoS)*x.wellCostM-S.bid,cosOk=Math.abs(S.cos/100-x.expertCoS)<=0.1;

  S.score.bid=(cosOk?1:0)+(win?(trueEmv>=0?2:0):1);
  let msg=win?`You won the block: the rival bid $${rival}M. `:`You lost: the rival bid $${rival}M and took the block. `;
  msg+=`An experienced team would put the chance of success nearer ${Math.round(x.expertCoS*100)}%, which makes the true EMV of your bid ${trueEmv>=0?'+':''}$${trueEmv.toFixed(0)}M. `;
  msg+=!win?"Losing a good block hurts, but it beats overpaying for a bad one. For training, you'll still drill it to see what you'd have found.":trueEmv>=0?"That's a bid that creates value.":"You paid more than the risked value. Winners of bidding wars often overpay.";
  $("fb").innerHTML=mentor(msg,fbClass(S.score.bid))+`<p class="small">Points ${S.score.bid}/3</p>`;
  $("nextWrap").innerHTML=`<button class="primary" id="next">${win?'Drill the well':'See what the well would have found'}</button>`;$("next").onclick=()=>go(5);speak(msg)};
 wireAsk("Stage 4 commercial bid and EMV");
}

function outcome(){const b=BLK[S.block];if(S.block!==SC.wellPlacement.block)return{...b.result,points:0};return SC.wellPlacement.outcomes[S.loc]}
function stReveal(){
 const o=outcome();S.out=o;S.score.reveal=o.points;S.choices.Reveal=o.title;
 const flaw=BLK[S.block].fatalFlaw;
 $("vis").innerHTML=`<div class="kicker">Stage 7 · The reveal</div><h2>${esc(o.title)}</h2>${revealSvg(o.sands)}<p>${esc(o.text)}</p>${flaw?`<p class="small">Fatal flaw in ${S.block}: <b>${flaw}</b>. ${known(S.block)[flaw]?.v===0?'Your data had already shown it.':'It was still a question mark in your risk table.'}</p>`:''}`;
 const m=o.key==="disc"?"That's a discovery. Notice the model still overcalled it: four sands expected, three found. Even good wells humble you.":o.key==="marg"?"Right block, wrong spot. Seniors have drilled this exact well.":flaw?`Every element worked except one, the ${flaw.toLowerCase()}. One cross in the risk table is all it takes. This is why we buy data before we bid.`:"The trap was there; the well wasn't in it.";
 $("panel").innerHTML=mentor(m,fbClass(o.points))+`<button class="primary" id="next" style="margin-top:12px">Go to the decision</button>`+askBlock();speak(m);$("next").onclick=()=>go(7);wireAsk("Stage 6 post-drill reveal");
}

/* ---------- 7. Decide ---------- */
function stDecide(){
 const o=S.out,opts=SC.decisions[o.key],st=SC.stages.decide;
 $("vis").innerHTML=`<div class="kicker">Stage 8 · Decide under pressure</div><h2>Six months later, the world changes</h2><table><tr><th>When</th><th>Event</th></tr>${SC.events.map(e=>`<tr><td>${e.when}</td><td>${esc(e.text)}</td></tr>`).join("")}</table><p class="small" style="margin-top:10px">Your result: ${esc(o.title)} in ${S.block}</p>`;
 $("panel").innerHTML=video(st.video)+mentor(st.intro)+teamBox("decide")+ownerPick("decide")+`<div class="opts" id="opts">${opts.map((x,j)=>`<button data-j="${j}">${esc(x.text)}</button>`).join("")}</div><div id="fb"></div><div id="nextWrap"></div>`+askBlock();speak(st.intro);
 document.querySelectorAll("#opts button").forEach(b=>b.onclick=()=>{recordOwner("decide");const x=opts[+b.dataset.j];S.score.decide=x.points;S.choices.Decide=x.text;document.querySelectorAll("#opts button").forEach(y=>{y.disabled=true;y.classList.toggle("pick",y===b)});$("fb").innerHTML=mentor(x.feedback,fbClass(x.points))+`<p class="small">Points ${x.points}/3</p>`;$("nextWrap").innerHTML=`<button class="primary" id="next">See your debrief</button>`;$("next").onclick=()=>go(8);speak(x.feedback)});
 wireAsk("Stage 7 commercial decision");
}

/* ---------- Debrief ---------- */
function stDebrief(){
 const rows=[["Data room","data"],["Screen","screen"],["Bid","bid"],["Drill","drill"],["Reveal","reveal"],["Decide","decide"]];
 const total=rows.reduce((a,r)=>a+(S.score[r[1]]||0),0),max=rows.length*SC.scoring.maxPerStage;
 const band=SC.scoring.bands.find(b=>total>=b.min).label;
 const msg2={"Senior explorer instincts":"You read the data and the money the way a veteran does.","Practitioner":"Solid calls, with gaps a mentor would close quickly.","Graduate instincts":"Normal on a first run. This is exactly the experience the tool exists to give."}[band]||"";
 $("vis").innerHTML=`<div class="kicker">Debrief · ${esc(S.team.name)}</div><h2>${band}: ${total} / ${max}</h2><p>${msg2}</p><table><tr><th>Stage</th><th>Your call</th><th>Owner</th><th>Pts</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(S.choices[r[0]]||"")}</td><td>${esc(S.owner[r[1]]||"Team")}</td><td>${S.score[r[1]]??0}/3</td></tr>`).join("")}</table>
 <h3>The truth about each block</h3><table><tr><th>Block</th><th>Fatal flaw</th></tr>${SC.blocks.map(b=>`<tr><td>${b.id}</td><td>${b.fatalFlaw?b.fatalFlaw+": "+esc(b.flawText):"<b>None. All elements work.</b>"}</td></tr>`).join("")}</table>
 <h3>Real cases behind the lessons</h3><ul class="small">${SC.realCases.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`;
 const m=`${total} out of ${max}. Ask me why any call scored the way it did, or play again and try a different path.`;
 $("panel").innerHTML=mentor(m)+`<div class="row" style="margin-top:14px"><button class="primary" id="again">Play again with the same team</button></div>`+askBlock();speak(m);
 $("again").onclick=()=>{Object.assign(S,{score:{},choices:{},owner:{},bought:[],block:null,cos:null,bid:null,loc:null,out:null});go(1)};wireAsk(`Final debrief, score ${total}/${max}`);
}
go(0);
</script>
