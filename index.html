<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drill or Drop v3.2: The Delta Basin Licence Round</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ec;--card:#fffdf9;--ink:#1d2430;--muted:#5b6472;--line:#ddd6c9;--accent:#c4621d;--deep:#14213d;--ok:#2f7d5b;--bad:#a83232;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--deep);color:#f5f2ec;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:700}
header small{color:#c9d1dd;display:block;font-weight:400;font-size:13px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 9px;border-radius:999px;background:#25355c;color:#c9d1dd}
.steps span.on{background:var(--accent);color:#fff}.steps span.done{background:var(--ok);color:#fff}
main{max-width:1200px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media(max-width:880px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
h2{font-size:20px;margin:0 0 6px}h3{font-size:16px;margin:16px 0 6px}
.kicker{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:600}
svg{width:100%;height:auto;display:block}
.mentor{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--deep);color:#f0a04b;display:grid;place-items:center;font-weight:700}
.bubble{background:#eef2f7;border-radius:12px;padding:11px 13px;font-size:15px}
.fb-good{background:#e5f4e4}.fb-mid{background:#f9eeda}.fb-bad{background:#fbebeb}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;text-align:left}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{cursor:default;opacity:.85}
button.pick{border:2px solid var(--accent);background:#fff6ee}
.primary{background:var(--accent);color:#fff;border:none;text-align:center;font-weight:600}
.primary:hover:not(:disabled){background:#a9521a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{background:transparent;color:#f5f2ec;border:1px solid #5a6a8e;padding:6px 11px;font-size:13px}
textarea,input[type=text],select{font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);padding:9px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:60px;resize:vertical}
.ask{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.ask label,.small{font-size:13px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;flex:none}
.chk.bought{background:#eef6ee}
.video{background:var(--deep);color:#c9d1dd;border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.video .play{width:32px;height:32px;border-radius:50%;background:#f0a04b;color:var(--deep);display:grid;place-items:center;font-weight:700;flex:none}
.blk,.loc{cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.rt td,.rt th{text-align:center}.rt td:first-child,.rt th:first-child{text-align:left}
.c-ok{color:var(--ok);font-weight:700}.c-mid{color:#b06d12;font-weight:700}.c-bad{color:var(--bad);font-weight:700}.c-unk{color:#9aa4b1;font-weight:700}
.emv,.info,.team{background:#f3eee5;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.emv b{font-size:18px}
.team ul{margin:4px 0 0;padding-left:18px}.team li{margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{padding:7px 11px;font-size:14px}
.member{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.hidden{display:none}
header h1 .v2{font-size:11px;background:#c4621d;color:#fff;border-radius:6px;padding:2px 6px;vertical-align:middle}
.face{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;transition:box-shadow .15s}
.face svg{width:100%;height:100%}
.face.talking{box-shadow:0 0 0 3px #f0a04b,0 0 12px #f0a04b}
.face .eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.face .mouth{transform-box:fill-box;transform-origin:center}
.face.talking .mouth{animation:talk .16s infinite alternate}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(3.2)}}
.bubble{position:relative;padding-right:34px}
.bubble .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.replay{position:absolute;top:6px;right:6px;border:none;background:transparent;font-size:15px;padding:2px 4px;cursor:pointer}
.advbox{border:1px dashed #cbbfa9;border-radius:12px;padding:10px;margin-top:12px}
.advbox h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.advs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:480px){.advs{grid-template-columns:1fr}}
.adv{display:flex;gap:8px;align-items:center;font-size:12px;padding:6px 8px;color:var(--muted)}
.adv .face{width:36px;height:36px}.adv b{display:block;font-size:13px;color:var(--ink)}
.huddle{width:100%;margin-top:6px;font-size:13px;text-align:center;font-weight:600;background:#fff7e6;border-color:#e6c27a}
.lock{background:#fbebeb;color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
details.whyc{background:#eef3fb;border:1px solid #c9d7ee;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px}
details.whyc summary{cursor:pointer;font-weight:600;color:#1f4f8f}
details.whyc p{margin:8px 0 4px}
.cast{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:480px){.cast{grid-template-columns:1fr}}
.castc{display:flex;gap:8px;align-items:center;background:#f7f4ee;border-radius:10px;padding:8px;font-size:13px;cursor:pointer}
.castc:hover{background:#efe9df}.castc .face{width:50px;height:50px}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.t-ok{background:#e5f4e4;color:#245c42}.t-bad{background:#fbebeb;color:#8a2626}.t-mid{background:#f9eeda;color:#8a5a00}.t-ctx{background:#eef2f7;color:#41506a}
.seis{margin:10px 0}.seis-t{font-size:13px;font-weight:600;margin-bottom:4px}
.seis-w{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seis-w canvas{display:block;width:100%;height:auto}.seis-o{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.challenge{border:2px solid #14213d22;border-radius:12px;padding:10px;margin-top:10px;background:#f8f6f1}
.challenge textarea{margin-top:8px}
.chartbox{border:1px solid var(--line);border-radius:10px;padding:6px;background:#fffdf9}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:4px 6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,#14213d 0 6px,transparent 6px 10px)}.legend i.riv{background:repeating-linear-gradient(90deg,#9aa4b1 0 2px,transparent 2px 5px)}
.tabs{margin-bottom:10px}
.cbars{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.cbar{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 44px;gap:10px;align-items:center;font-size:13px}
.cl{display:flex;flex-direction:column;gap:2px}.cl .tag{align-self:flex-start}
.ct{height:12px;background:#eee6da;border-radius:6px;overflow:hidden}.cf{height:100%;background:#14213d;border-radius:0 4px 4px 0}
.cv{font-weight:700;text-align:right}
@media(max-width:520px){.cbar{grid-template-columns:1fr 50px}.ct{grid-column:1/-1;order:3}}
.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:620px){.journey{grid-template-columns:1fr}}
.jstep{background:#f3eee5;border-radius:10px;padding:10px}.jn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#c4621d;color:#fff;font-size:12px;font-weight:700;margin-right:6px}
@media print{header,#panel,.tabs,#print,footer{display:none!important}main{display:block}.card{border:none}}
.overlay{position:fixed;inset:0;z-index:50;overflow:auto;transition:opacity .35s}.overlay.leaving{opacity:0}
.cover{background:#081627;color:#eef2f6;display:grid;place-items:center}
.cover #covSeis{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32;filter:saturate(.7);animation:pan 40s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1.15) translateX(-3%)}to{transform:scale(1.15) translateX(3%)}}
.cov-shade{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(8,22,39,.35),rgba(8,22,39,.92) 70%)}
.cov-in{position:relative;max-width:780px;padding:40px 24px;text-align:left}
.cov-kick{letter-spacing:6px;text-transform:uppercase;color:#f0b35a;font-weight:700;font-size:14px}
.cov-title{font-size:clamp(48px,11vw,104px);line-height:.95;margin:10px 0 0;font-weight:700;letter-spacing:-2px}
.cov-rule{width:120px;height:4px;background:linear-gradient(90deg,#f0b35a,#7ee0d6);margin:20px 0;border-radius:2px}
.cov-sub{font-size:18px;color:#c9d6e3;max-width:560px;margin:0}
.cov-facts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.cov-facts span{border:1px solid #3c5674;border-radius:999px;padding:4px 12px;font-size:13px;color:#cfd9e3}
.cov-btn{background:#f0b35a;color:#081627;border:none;font-weight:700;font-size:17px;padding:14px 26px;border-radius:12px;cursor:pointer;text-align:center}
.cov-btn:hover{background:#ffc672}
.cov-pow{margin-top:44px;border-top:1px solid #23405f;padding-top:18px}.cov-pl{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#8ea3b8;margin-bottom:10px}
.cov-partners{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.cov-p{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}.cov-p svg{width:44px;height:44px}.cov-x{color:#5d7894;font-size:20px}
.cov-ver{margin-top:18px;font-size:12px;color:#7f93a8}
.intro{background:#0d1d31;display:grid;place-items:center;padding:16px}
.iv-wrap{width:min(1000px,100%)}.iv-head{color:#c9d6e3;font-size:14px;margin-bottom:8px;display:flex;gap:10px;align-items:center}.iv-tag{background:#c4621d;color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.iv-screen{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#14304f,#0b1b2e);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:38% 1fr;box-shadow:0 20px 50px #0008}
@media(max-width:640px){.iv-screen{aspect-ratio:auto;grid-template-columns:1fr;padding-bottom:90px}.iv-right{padding:8px 20px 20px!important}}
.iv-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px}
.iv-face{width:min(220px,40vw)!important;height:min(220px,40vw)!important;box-shadow:0 0 0 6px #ffffff14}
.iv-face.talking{box-shadow:0 0 0 6px #f0b35a,0 0 30px #f0b35a88}
.iv-name{text-align:center;color:#eef2f6}.iv-name b{display:block;font-size:17px}.iv-name span{font-size:12px;color:#9fb3c8}
.iv-right{padding:28px 28px 70px 8px;color:#eef2f6;display:flex;flex-direction:column;justify-content:center}
.iv-chap{font-size:12px;letter-spacing:2px;color:#f0b35a;font-weight:700}.iv-right h2{font-size:clamp(22px,3.4vw,34px);margin:6px 0 12px;color:#fff}
.iv-right ul{margin:0;padding-left:18px}.iv-right li{margin:6px 0;font-size:clamp(14px,1.7vw,17px);opacity:0;animation:fadeup .5s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.iv-cap{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:14px;padding:10px 16px;line-height:1.4}
.iv-bar{margin-top:10px}.iv-prog{height:4px;background:#23405f;border-radius:2px;overflow:hidden}.iv-prog div{height:100%;background:#f0b35a;transition:width .4s}
.iv-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.iv-ctrl button{background:#183456;color:#eef2f6;border:1px solid #2d4d72;text-align:center;padding:8px 12px}
.iv-ctrl .primary{margin-left:auto;background:#f0b35a;color:#081627;border:none}
.iv-dots{display:flex;gap:6px}.iv-dot{width:10px!important;height:10px;padding:0!important;border-radius:50%!important;background:#2d4d72!important;border:none!important}.iv-dot.on{background:#f0b35a!important}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}.hs{background:#f3eee5;border-radius:12px;padding:12px}.hl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}.hv{font-size:34px;font-weight:700}
.hbar{height:8px;background:#e3dccd;border-radius:4px;overflow:hidden;margin:4px 0 6px}.hbar i{display:block;height:100%;background:#14213d}
.quad{grid-column:1/-1;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.quad b{font-size:16px}.q-gg{background:#e5f4e4}.q-gb{background:#eef3fb}.q-bg{background:#f9eeda}.q-bb{background:#fbebeb}
table.econ td,table.econ th{font-size:13px}
@media print{.overlay{display:none!important}}
</style>
</head>

re still only priors?", "gph": "Do the trap and seal hold after reprocessing?", "com": "Which surviving block has the best value if it works?", "pe": "Which block can we actually drill at a sensible cost?"}, "bid": {"geo": "Turn the risk table into a chance of success.", "gph": "How much of the trap risk is still open?", "com": "You own this call: chance of success, bonus, and the rival.", "pe": "Confirm the dry-hole cost in the EMV."}, "drill": {"geo": "Which location tests the best reservoir?", "gph": "Avoid the fault and the gas cloud if you can.", "com": "A clean answer protects the value of the block.", "pe": "You own this call: where does the rig go?"}, "decide": {"geo": "What did the well prove about the play?", "gph": "Can the new well tie the seismic and improve the map?", "com": "You own this call: appraise, farm down, sell or wait?", "pe": "What would appraisal cost, and how many wells?"}}, "dataBudgetM": 3.0, "freeData": ["Regional 2D seismic grid (poor under the D-5 gas cloud)", "Published regional source-rock studies", "Public well database: names and depths only"], "blocks": [{"id": "D-3", "name": "D-3 · Inner shelf", "waterDepth": "30 m", "play": "Faulted shelf blocks near old wells", "resourceMMboe": 40, "valuePerBoe": 3, "wellCostM": 15, "expertCoS": 0.05, "mapRect": [30, 95, 140, 95], "truth": {"Source": false, "Reservoir": true, "Trap": true, "Seal": true, "Charge": false}, "fatalFlaw": "Source", "flawText": "immature under the inner shelf", "free": {"Reservoir": "Old wells found good sands", "Trap": "Clear fault blocks on 2D", "Seal": "Thick shale cap in old wells"}, "result": {"key": "dry", "title": "Dry: good sands, no oil", "sands": [0.2, 0.2, 0.2, 0.2], "text": "Beautiful water-wet sands and not a trace of oil. The source beneath the inner shelf never got hot enough. The old wells were telling you that."}, "pc": 0.9, "rivals": [{"name": "Rival A · cautious independent", "bidM": 3}, {"name": "Rival B · mid-size operator", "bidM": 6}, {"name": "Rival C · ambitious new entrant", "bidM": 9}], "prior": {"Source": 0.55, "Charge": 0.6}, "priorWhy": {"Source": "Regional source is proven basinward; maturity under the inner shelf is unproven", "Charge": "Short migration distance if the source is mature"}}, {"id": "D-5", "name": "D-5 · Outer shelf, Osprey West", "waterDepth": "120 m", "play": "Rollover against a shale diapir, under a gas cloud", "resourceMMboe": 150, "valuePerBoe": 3, "wellCostM": 60, "expertCoS": 0.3, "mapRect": [200, 215, 125, 90], "truth": {"Source": true, "Reservoir": true, "Trap": true, "Seal": true, "Charge": true}, "fatalFlaw": null, "flawText": null, "free": {"Source": "Regional source mature here", "Reservoir": "Shelf-edge sands on trend"}, "result": null, "pc": 0.85, "rivals": [{"name": "Rival A · cautious independent", "bidM": 12}, {"name": "Rival B · mid-size operator", "bidM": 28}, {"name": "Rival C · ambitious new entrant", "bidM": 45}], "prior": {"Source": 0.85, "Reservoir": 0.75, "Trap": 0.5, "Seal": 0.55, "Charge": 0.6}, "priorWhy": {"Trap": "Gas cloud degrades imaging; closure depends on depth conversion", "Seal": "Fault-bounded closure; throw and fault-rock properties unmeasured", "Charge": "Outer shelf lies on the regional migration fairway"}}, {"id": "D-7", "name": "D-7 · Upper slope, Osprey East", "waterDepth": "450 m", "play": "Textbook four-way 'turtle' structure", "resourceMMboe": 200, "valuePerBoe": 3, "wellCostM": 70, "expertCoS": 0.1, "mapRect": [370, 205, 120, 85], "truth": {"Source": true, "Reservoir": true, "Trap": true, "Seal": true, "Charge": false}, "fatalFlaw": "Charge", "flawText": "carrier bed is a low, so oil migrates away", "free": {"Source": "Regional source mature", "Reservoir": "Slope fans on 2D", "Trap": "Perfect four-way on 2D", "Seal": "Regional marine shale"}, "result": {"key": "dry", "title": "Dry: perfect trap, no charge", "sands": [0.2, 0.2, 0.2, 0.2], "text": "The trap is exactly as mapped, the sands are excellent, and they're full of water. The carrier bed under the turtle is a low, so the oil climbed away toward the diapir, into D-5."}, "pc": 0.8, "rivals": [{"name": "Rival A · cautious independent", "bidM": 20}, {"name": "Rival B · mid-size operator", "bidM": 45}, {"name": "Rival C · ambitious new entrant", "bidM": 90}], "prior": {"Charge": 0.55}, "priorWhy": {"Charge": "Four-way is clear; whether the carrier bed feeds it is untested"}}, {"id": "D-9", "name": "D-9 · Shelf edge rollover", "waterDepth": "80 m", "play": "Rollover on a small growth fault", "resourceMMboe": 90, "valuePerBoe": 3, "wellCostM": 55, "expertCoS": 0.1, "mapRect": [190, 105, 130, 85], "truth": {"Source": true, "Reservoir": true, "Trap": true, "Seal": false, "Charge": true}, "fatalFlaw": "Seal", "flawText": "fault throw smaller than sand thickness", "free": {"Source": "Regional source mature", "Reservoir": "Stacked shelf-edge sands", "Trap": "Rollover closure on 2D"}, "result": {"key": "dry", "title": "Leaked: residual oil, thin gas", "sands": [0.5, 0.2, 0.2, 0.2], "text": "Oil was here: you can see residual oil staining. But the fault throw is smaller than the sand, so sand sat against sand and the column leaked out through the relay zone."}, "pc": 0.8, "rivals": [{"name": "Rival A · cautious independent", "bidM": 8}, {"name": "Rival B · mid-size operator", "bidM": 20}, {"name": "Rival C · ambitious new entrant", "bidM": 35}], "prior": {"Seal": 0.55, "Charge": 0.65}, "priorWhy": {"Seal": "Small growth fault; throw against sand thickness unmeasured", "Charge": "Shelf position near known migration paths"}}, {"id": "D-11", "name": "D-11 · Deep basin floor", "waterDepth": "1,800 m", "play": "Huge closure beyond the diapir", "resourceMMboe": 400, "valuePerBoe": 1, "wellCostM": 120, "expertCoS": 0.05, "mapRect": [440, 300, 140, 75], "truth": {"Source": true, "Reservoir": false, "Trap": true, "Seal": true, "Charge": true}, "fatalFlaw": "Reservoir", "flawText": "sand never reached the basin floor", "free": {"Trap": "Very large closure on 2D", "Seal": "Thick deep-water shale"}, "result": {"key": "dry", "title": "Dry: no reservoir", "sands": [0, 0, 0, 0], "text": "3,000 ft of shale and a few gas shows. The delta's sand never reached this far out. Big closure, nothing to fill."}, "pc": 0.45, "rivals": [{"name": "Rival A · cautious independent", "bidM": 10}, {"name": "Rival B · mid-size operator", "bidM": 40}, {"name": "Rival C · ambitious new entrant", "bidM": 120}], "prior": {"Source": 0.6, "Reservoir": 0.4, "Charge": 0.5}, "priorWhy": {"Source": "Deep-water source likely present; maturity and phase uncertain", "Reservoir": "Distal basin floor; reach of the slope fans is unknown", "Charge": "Long migration path from the kitchen"}}], "dataItems": [{"id": "wells", "title": "Old well reports, D-3 area (analogue)", "costM": 0.2, "kind": "Analogue", "reveals": {"D-3": {"Source": {"ok": false, "text": "No shows, maturity too low (immature)", "p": 0.08}, "Charge": {"ok": false, "text": "Nothing to charge from", "p": 0.08}}}, "voi": {"value": "high", "why": "Killed D-3 for only $0.2M: no source, no shows."}, "short": "old well reports"}, {"id": "basin", "title": "Regional basin model: maturity and migration", "costM": 1.5, "kind": "Study", "reveals": {"D-3": {"Source": {"ok": false, "text": "Immature under the inner shelf", "p": 0.08}, "Charge": {"ok": false, "text": "No mature kitchen", "p": 0.08}}, "D-5": {"Charge": {"ok": true, "text": "Carrier rises toward the diapir and focuses oil here", "p": 0.8}}, "D-7": {"Charge": {"ok": false, "text": "Carrier is a low under the turtle; oil migrates away", "p": 0.08}}, "D-9": {"Charge": {"ok": true, "text": "On the migration path", "p": 0.85}}, "D-11": {"Source": {"ok": true, "text": "Mature, gas-prone", "p": 0.9}, "Charge": {"ok": true, "text": "Charged with gas", "p": 0.8}}}, "voi": {"value": "high", "why": "Tests charge on every block and finds the D-3 and D-7 flaws. Expensive, but decisive."}, "short": "basin model"}, {"id": "reproc", "title": "Reprocess 2D through the gas cloud and faults", "costM": 1.0, "kind": "Seismic", "reveals": {"D-5": {"Trap": {"ok": true, "text": "Closure holds after depth conversion", "p": 0.8}, "Seal": {"ok": true, "text": "Throw ~250 ft against 80 ft sand: sand faces shale. Juxtaposition risk reduced; fault-rock seal still uncertain", "p": 0.75}}, "D-9": {"Seal": {"ok": false, "text": "Throw ~40 ft against 90 ft sand: sand faces sand across the fault, with a relay ramp to the east. High juxtaposition risk", "p": 0.08}}}, "voi": {"value": "high", "why": "Found the D-9 seal flaw and de-risked the D-5 trap through the gas cloud."}, "short": "seismic reprocessing"}, {"id": "dw", "title": "Deep-water analogue well, 30 km south (public report)", "costM": 0.3, "kind": "Analogue", "reveals": {"D-11": {"Reservoir": {"ok": false, "text": "Distal shale; sands pinch out before the basin floor", "p": 0.08}}}, "voi": {"value": "high", "why": "Killed D-11 for $0.3M: the sand never reached the basin floor."}, "short": "deep-water analogue well"}, {"id": "geochem", "title": "Seabed geochemistry (seeps) survey", "costM": 1.2, "kind": "Survey", "reveals": {"D-5": {"Charge": {"ok": true, "text": "Oil seeps above the structure", "p": 0.75}}, "D-9": {"Charge": {"ok": true, "text": "Oil seeps nearby", "p": 0.8}}, "D-7": {"Charge": {"ok": false, "text": "No seeps over the structure", "p": 0.2}}, "D-11": {"Source": {"ok": true, "text": "Gas-only seeps", "p": 0.85}}}, "voi": {"value": "medium", "why": "A cheaper charge test that finds the D-7 flaw, but it overlaps the basin model."}, "short": "seep survey"}, {"id": "d11_3d", "title": "Fast-track 3D over D-11 (closure definition)", "costM": 1.4, "kind": "Seismic", "reveals": {"D-11": {"Trap": {"ok": true, "text": "Closure confirmed, even larger on 3D", "p": 0.95}}}, "voi": {"value": "low", "why": "Confirmed a closure you already knew was there. It couldn't change any decision."}, "short": "fast-track 3D"}], "bid": {"cosOptionsPct": [10, 20, 30, 50], "bonusOptionsM": [10, 25, 50, 70, 110], "convention": ["Value if successful = after-tax NPV of the development, net of development costs and of the successful exploration well.", "Dry-hole cost = after-tax cost of the exploration well, lost only if the well fails.", "Pg = geological chance of success. Pc = chance a discovery is large enough to be commercial. Sub-commercial discoveries are treated as dry holes.", "EMV = Pg × Pc × value − (1 − Pg × Pc) × dry-hole cost − signature bonus."]}, "wellPlacement": {"block": "D-5", "locations": [{"id": "L1", "x": 300, "y": 125, "points": 1, "feedback": "L1 is on the crest, but right beside the bounding fault and under the gas cloud. Bold, and risky."}, {"id": "L2", "x": 225, "y": 172, "points": 3, "feedback": "L2 is in the largest fault block of the rollover, on a seismic line, away from the bounding fault and the gas cloud. You give up a little height for a clean answer."}, {"id": "L3", "x": 330, "y": 66, "points": 0, "feedback": "L3 is across the bounding fault, outside the closure. That's outside the trap."}], "outcomes": {"L1": {"key": "marg", "title": "Marginal: thin gas over oil", "sands": [0.5, 0.5, 0.5, 0], "text": "Right block, risky spot. Near the fault the sands are thin and the column is gassy. About 40 ft of net pay.", "points": 1}, "L2": {"key": "disc", "title": "Discovery: three stacked oil sands", "sands": [1, 1, 1, 0], "text": "About 120 ft of net oil pay in three sands. The fourth sand shaled out at the channel margin, so even the right block came in below the pre-drill model.", "points": 3}, "L3": {"key": "dry", "title": "Dry: outside the trap", "sands": [0.2, 0.2, 0.2, 0.2], "text": "Good sands, all water-wet. You drilled across the fault.", "points": 0}}, "sectionX": {"L3": 110, "L1": 238, "L2": 345}}, "events": [{"when": "Month 2", "text": "Oil price falls from $80 to $55 a barrel"}, {"when": "Month 4", "text": "A neighbour's well 8 km east is dry"}, {"when": "Month 6", "text": "A larger operator offers $25M cash for your block. Answer in two weeks."}], "decisions": {"disc": [{"text": "Appraise now with two wells, 100% funded", "points": 2, "feedback": "Highest EMV, but $80M of exposure breaks the board's $60M limit. Right economics, wrong for this company this year. Without the limit, this would be the best choice."}, {"text": "Farm down 50% to a partner who pays for appraisal", "points": 3, "feedback": "Best within the limit. You give up about $77M of EMV to remove all further exposure, and a partner's money tests the field. That's what a farm-out is for."}, {"text": "Accept the $25M cash offer", "points": 0, "feedback": "Cash today, but the offer is a fraction of the $158M EMV even after giving away half. An unsolicited bid tells you the block is worth more than $25M."}, {"text": "Wait and study for a year", "points": 1, "feedback": "Waiting adds cost and delay and still needs $80M later. Lower value than appraising now, and the licence clock keeps running."}], "marg": [{"text": "Appraise now, 100% funded", "points": 0, "feedback": "Low EMV and $80M of exposure on a 35% chance. That breaks the limit for very little value."}, {"text": "Farm down 50% for an appraisal carry", "points": 3, "feedback": "Best value with no exposure: a partner pays to test the flank, and you keep half the upside."}, {"text": "Accept the $25M cash offer", "points": 1, "feedback": "Equal to appraising on value, with no risk. Reasonable, but you sell the option that the studies might upgrade the field."}, {"text": "Wait for fault-seal and pressure studies", "points": 2, "feedback": "Same EMV as the farm-out for only $5M now. If the studies come back good, you'll still need $80M, so plan the farm-out then."}], "dry": [{"text": "Drill a second well on the same structure", "points": 0, "feedback": "Same structure, same failed element. A second well spends $60M to relearn the lesson."}, {"text": "Relinquish and bid for D-5 in the next round", "points": 3, "feedback": "You turn a dry hole into knowledge and take it to the block where the evidence points. Positive EMV, within the limit, if you bid with discipline."}, {"text": "Sell the block for what it fetches", "points": 2, "feedback": "Small but positive value, and you stop the bleeding. Reasonable if you have nowhere better to put the team."}, {"text": "Hold and study for a year", "points": 1, "feedback": "Licence fees and no plan. Holding is only worth it if a specific study could change the answer."}]}, "stages": {"basin": {"video": "Reading a deltaic margin", "intro": "Welcome to the Delta Basin licence round. Five blocks are on offer. I'll tell you now: only one of them has every element working. The other four each hide a fatal flaw. Click each block to see what we know."}, "data": {"video": "Value of information", "intro": "Here's the data room. The table shows what our free data already supports, and the question marks show what we don't know. You have three million dollars. Buy studies, or cheap analogues, to find the fatal flaws. You can't buy everything, so think about which question each item answers."}, "screen": {"video": "Screening the blocks", "intro": "Now choose one block to bid on. Use your risk table and the evidence-based value of each block. A red number is a risk your own data says is likely fatal; a grey number is a regional prior you're choosing to carry. You won't learn whether you chose well until the well is drilled."}, "bid": {"video": "Turning risk into money", "intro": "Now the commercial side. Set your geological chance of success from the risk table, then choose a signature bonus, or walk away. Three other companies are bidding, and the bids are sealed."}, "drill": {"video": "Choosing a well location", "intro": "This is Osprey West in D-5. Click where you'd drill. Remember the gas cloud and the fault."}, "decide": {"video": "Decisions under pressure", "intro": "Markets move, neighbours drill, and someone offers you money. What do you do?"}}, "realCases": ["Charge: two neighbouring Gulf of Mexico structures, one billion-barrel field and one dry", "Seal: rollover dry holes where throw was less than sand thickness", "Value of information and imaging: subsalt Gulf of Mexico well placement", "The cash offer: a North Sea heavy-oil discovery later developed into a large field"], "scoring": {"maxPerStage": 3, "stages": ["data", "screen", "bid", "drill", "reveal", "decide"], "bands": [{"min": 15, "label": "Senior explorer instincts"}, {"min": 10, "label": "Practitioner"}, {"min": 0, "label": "Graduate instincts"}]}, "advisorCalls": 5, "cast": {"coach": {"id": "EH", "name": "Dr. Eleanor Hughes", "role": "Your coach · former exploration VP", "intro": "I'm Eleanor. Thirty years of exploration, from the North Sea to West Africa. I'll coach you and tell you how each call played out.", "face": {"skin": "#f1d0b5", "bg": "#e9e4f2", "top": "#14213d", "hair": "bob", "hairColor": "#b9b9c2", "glasses": true}, "voice": {"gender": "f", "langs": ["GB", "IE", "AU"], "pitch": 1.0, "rate": 0.95}}, "advisors": [{"id": "HL", "name": "Henrik Larsen", "role": "Exploration manager · volumes and growth", "color": "#2b5d8a", "intro": "Henrik Larsen, exploration manager. I'm paid to find big barrels. Bold bets build portfolios.", "face": {"skin": "#f3d2b8", "bg": "#dce8f3", "top": "#2b5d8a", "hair": "short", "hairColor": "#d8b86a", "beard": "#c9a65a"}, "voice": {"gender": "m", "langs": ["GB", "US", "AU"], "pitch": 1.0, "rate": 1.08}}, {"id": "MC", "name": "Mei Chen", "role": "Geophysicist · imaging and seismic", "color": "#7a2f86", "intro": "Mei Chen, geophysicist. If the seismic is lying to you, I'll tell you where and why.", "face": {"skin": "#f0cfa8", "bg": "#f3e3ec", "top": "#7a2f86", "hair": "long", "hairColor": "#1b1b1b", "ear": true}, "voice": {"gender": "f", "langs": ["SG", "GB", "AU"], "pitch": 1.2, "rate": 1.05}}, {"id": "RS", "name": "Dr. Rafael Souza", "role": "Geochemist · source and charge", "color": "#2f7d5b", "intro": "Rafael Souza, geochemist. Traps are easy to find. Oil that actually reaches them is not.", "face": {"skin": "#b98157", "bg": "#e1efe3", "top": "#2f7d5b", "hair": "short", "hairColor": "#3a2516", "beard": "#3a2516"}, "voice": {"gender": "m", "langs": ["US", "GB", "AU"], "pitch": 0.9, "rate": 1.0}}, {"id": "AM", "name": "Arjun Mehta", "role": "Structural geologist · faults and seal", "color": "#c4621d", "intro": "Arjun Mehta, structural geologist. I look at every fault and ask one question: does it hold?", "face": {"skin": "#a8714a", "bg": "#f6e6d6", "top": "#c4621d", "hair": "short", "hairColor": "#151515", "mous": true, "glasses": true}, "voice": {"gender": "m", "langs": ["IN", "GB", "AU"], "pitch": 0.95, "rate": 1.02}}, {"id": "SO", "name": "Sarah O'Connell", "role": "Commercial lead · economics and deals", "color": "#0f7a72", "intro": "Sarah O'Connell, commercial lead. Every geological story ends as a number. I make sure it's a good one.", "face": {"skin": "#f6d7c3", "bg": "#dff0ee", "top": "#0f7a72", "hair": "bob", "hairColor": "#b5562a", "freck": true}, "voice": {"gender": "f", "langs": ["IE", "GB", "AU"], "pitch": 1.1, "rate": 1.0}}]}, "lockedStages": {"bid": "Sealed bids close at noon. The team has said its piece; the envelope is yours to sign. No calls at this stage."}, "advice": {"data": {"HL": {"s": "Spend it on D-11. Four hundred million barrels! Get the fast-track 3D and firm up that closure. That's where careers are made.", "ok": false, "opt": ["d11_3d"]}, "MC": {"s": "The gas cloud is wrecking our image over D-5, and the shelf faults are poorly imaged too. Reprocessing the 2D answers trap and seal questions on two blocks for a million.", "ok": true, "opt": ["reproc"]}, "RS": {"s": "Big traps are cheap; charge is not. The basin model tells us where the kitchen is and which way the oil went. If that's too expensive, the seep survey is a cheaper test of charge.", "ok": true, "opt": ["basin", "geochem"]}, "AM": {"s": "D-9's growth fault looks small to me against thick sands. If the throw is less than the sand, it leaks. Reprocessing will give us the throw.", "ok": true, "opt": ["reproc"]}, "SO": {"s": "Three million doesn't go far. Start with the cheap analogues: old D-3 wells for $0.2M and the deep-water well for $0.3M. Either one could kill a block for pennies.", "ok": true, "opt": ["wells", "dw"]}}, "screen": {"HL": {"s": "D-11 or D-7. Biggest closures in the round. You don't find giants by bidding on 150-million-barrel blocks.", "ok": false, "opt": ["D-11", "D-7"]}, "MC": {"s": "D-5 frightens people because of the gas cloud. After reprocessing the closure holds. Don't let a bad image scare you off a good trap.", "ok": true, "opt": ["D-5"]}, "RS": {"s": "Oil follows the carrier bed, and the carrier rises toward the diapir. Anything draped on the diapir, like D-5, gets first call on the oil. A perfect trap off the migration path is just a perfect water trap.", "ok": true, "opt": ["D-5"]}, "AM": {"s": "I wouldn't touch D-9 until someone shows me the fault throw is bigger than the sand. Small growth faults and thick sands leak.", "ok": true, "opt": null}, "SO": {"s": "D-3 is the cheapest well in the round and close to old infrastructure. Low cost, low regret.", "ok": false, "opt": ["D-3"]}}, "drill": {"HL": {"s": "Go for the crest, L1. Maximum column, maximum headline.", "ok": false, "opt": ["L1"]}, "MC": {"s": "L2 sits on a seismic line, away from the gas cloud. It's the one spot where I actually trust the depth map.", "ok": true, "opt": ["L2"]}, "RS": {"s": "Charge isn't the issue on this block. Put the well where the reservoir and the trap are most certain.", "ok": null, "opt": null}, "AM": {"s": "Stay away from the fault. Crestal faults mean broken, thinner sands and a gassy column. And L3 is across the fault, outside the trap altogether.", "ok": true, "opt": ["L2"]}, "SO": {"s": "A clean, unambiguous result protects the value of the block when we farm out. Ambiguity costs money.", "ok": true, "opt": ["L2"]}}, "decide": {"disc": {"HL": {"s": "Appraise it ourselves, 100%. Why share a discovery?", "ok": "partly", "opt": [0]}, "MC": {"s": "The new well ties the seismic now. I'd shoot 3D before committing appraisal wells.", "ok": null, "opt": null}, "RS": {"s": "The neighbour's dry hole is off our migration path. It doesn't change our charge story at all.", "ok": null, "opt": null}, "AM": {"s": "Juxtaposition held at L2 and the column is there. The open questions now are compartments and fault-rock seal over production time.", "ok": null, "opt": null}, "SO": {"s": "Farm down half to a partner who pays for appraisal. We keep a big share and cap our exposure. And a $25M cash offer tells you the block is worth more than $25M.", "ok": true, "opt": [1]}}, "marg": {"HL": {"s": "Appraise now. The flank could hold thick oil.", "ok": false, "opt": [0]}, "MC": {"s": "The gas cloud hid the flank. We need better imaging before another well.", "ok": null, "opt": null}, "RS": {"s": "Oil is there, so the charge worked. The question is how much the trap holds.", "ok": null, "opt": null}, "AM": {"s": "Get the fault-seal and pressure studies done first. Does the fault hold a thicker column downdip?", "ok": true, "opt": [3]}, "SO": {"s": "Farm down for an appraisal carry. Let someone else pay to test the flank.", "ok": true, "opt": [1]}}, "dry": {"HL": {"s": "One dry hole proves nothing. Drill a second well on the structure.", "ok": false, "opt": [0]}, "MC": {"s": "The seismic didn't lie about the trap. Something else failed.", "ok": null, "opt": null}, "RS": {"s": "Your well proved the reservoir and the migration story. Take that knowledge to the block the oil actually goes to.", "ok": true, "opt": [1]}, "AM": {"s": "Name the failed element first. If it was seal or charge, a second well on the same structure fails the same way.", "ok": true, "opt": [1]}, "SO": {"s": "Sell it for what it fetches and cut our losses.", "ok": "partly", "opt": [2]}}}}, "why": {"data": {"title": "Value of information", "body": "Data is worth buying only if it can change a decision. For each item, ask: which block's fatal element does this test, and could the answer kill the block? Cheap analogues that can kill a block are the best value. Confirming what you already know, like a bigger closure on D-11, is worth nothing to the decision.", "course": "SCA: Value of Information course"}, "screen": {"title": "Risking is multiplicative", "body": "Chance of success = P(source) × P(reservoir) × P(trap) × P(seal) × P(charge). One element at zero makes the whole block zero, however big the closure. Screen out blocks with a confirmed fatal flaw first, then rank the survivors by risked value, not by unrisked size.", "course": "SCA: Resource Assessment & Risk · Exploration Academy"}, "bid": {"title": "EMV and the winner's curse", "body": "EMV = chance of success × value − chance of failure × dry-hole cost − bonus. An optimistic chance of success inflates EMV, and in competitive rounds the winner is often simply the most optimistic bidder (the winner's curse). Bid from a calibrated chance of success, and walk away when EMV goes negative.", "course": "SCA: Resource Assessment & Risk"}, "drill": {"title": "Placing an exploration well", "body": "Place exploration wells where the answer will be cleanest: well imaged, on a seismic line, inside closure, and away from the bounding fault. A crestal spot beside a fault or under a gas cloud trades a slightly higher column for depth uncertainty, thinner sands and an ambiguous result.", "course": "SCA: Exploration Academy (prospect maturation)"}, "reveal": {"title": "Post-drill analysis: name the failed element", "body": "Every dry hole has a reason: one petroleum-system element failed. Post-drill analysis names it and asks whether pre-drill data could have shown it.", "course": "SCA: Exploration Academy", "byFlaw": {"Source": ["An immature source never generates. Maturity depends on burial and heat flow, and the inner shelf was never buried deep enough.", "SCA: Exploration Academy (petroleum systems)"], "Cha /* ---------- advisors ---------- */
function advSet(stage){const a=SC.advice&&SC.advice[stage];if(!a)return null;return stage==="decide"?a[S.out.key]:a}
function advPanel(stage){
 if(SC.lockedStages&&SC.lockedStages[stage])return `<div class="advbox"><h4>Ask an advisor</h4><div class="lock">${esc(SC.lockedStages[stage])}</div></div>`;
 const set=advSet(stage);if(!set)return"";
 return `<div class="advbox"><h4>Ask an advisor · <span id="cl">${S.calls}</span> calls left</h4><div class="advs">${Object.keys(set).map(k=>`<button class="adv" data-a="${k}"><span class="face">${face(k)}</span><span><b>${esc(PEOPLE[k].name)}</b>${esc(PEOPLE[k].role.split(" · ")[0])}</span></button>`).join("")}</div><button class="huddle" id="hud">Huddle: hear everyone argue it out (2 calls)</button><div id="advout"></div></div>`}
function hudState(stage){const hb=$("hud"),set=advSet(stage);if(!hb||!set)return;const left=Object.keys(set).filter(k=>!S.asked.some(q=>q.stage===stage&&q.who===k)).length;
 hb.disabled=S.calls<2||left<2||S.decided===stage;hb.textContent=S.decided===stage?"Huddle: hear everyone argue it out (2 calls)":left<2?"Huddle: not enough advisors left to call":S.calls<2?"Huddle needs 2 calls":"Huddle: hear everyone argue it out (2 calls)"}
function wireAdv(stage){const set=advSet(stage);if(!set||!$("advout"))return;S.decided=null;
 const record=k=>{const a=set[k];S.asked.push({stage,who:k,s:a.s,ok:a.ok,opt:a.opt});document.querySelector(`.adv[data-a="${k}"]`).disabled=true;$("advout").insertAdjacentHTML("beforeend",bub(k,a.s,"",stage+"."+k));return LINES[LAST]};
 document.querySelectorAll(".adv").forEach(b=>b.onclick=()=>{const k=b.dataset.a;
  if(S.calls<=0){$("advout").insertAdjacentHTML("beforeend",bub(COACH.id,"You've used all your advisor calls. From here, the judgement is yours. That's the real job.","fb-mid"));say();document.querySelectorAll(".adv").forEach(x=>x.disabled=true);hudState(stage);return}
  S.calls--;$("cl").textContent=S.calls;record(k);say();hudState(stage)});
 hudState(stage);
 $("hud").onclick=()=>{const left=Object.keys(set).filter(k=>!S.asked.some(q=>q.stage===stage&&q.who===k));if(S.calls<2||left.length<2)return;S.calls-=2;$("cl").textContent=S.calls;speakQ(left.map(record));hudState(stage)}}
function lockAdv(stage,chosen){S.decided=stage;document.querySelectorAll(".adv,.huddle").forEach(x=>x.disabled=true);
 S.asked.filter(q=>q.stage===stage).forEach(q=>{q.followed=q.opt?q.opt.some(o=>Array.isArray(chosen)?chosen.includes(o):o===chosen):null})}
function whyCard(stage,pts,flaw){const w=SC.why&&SC.why[stage];if(!w||pts>=3)return"";let body=w.body,course=w.course;
 if(flaw&&w.byFlaw&&w.byFlaw[flaw]){body+=" "+w.byFlaw[flaw][0];course=w.byFlaw[flaw][1]}
 return `<details class="whyc" ${pts===0?'open':''}><summary>Why? 30-second explainer: ${esc(w.title)}</summary><p>${esc(body)}</p><p class="small">Go deeper: <b>${esc(course)}</b></p></details>`}

/* ---------- knowledge: probabilities, not ticks ---------- */
function baseProbs(){const P={};SC.blocks.forEach(b=>{const B=BLK[b.id];P[b.id]={};SC.elements.forEach(e=>{const pr=B.prior&&B.prior[e];P[b.id][e]=B.free[e]?{p:pr||.85,n:B.free[e],src:"free"}:{p:pr||.5,n:"Regional prior: "+((B.priorWhy&&B.priorWhy[e])||"no evidence yet"),src:null}})});return P}
function probsFrom(bought){const P=baseProbs();bought.forEach(id=>{const it=SC.dataItems.find(i=>i.id===id);for(const b in it.reveals)for(const e in it.reveals[b]){const r=it.reveals[b][e];P[b][e]={p:r.p??(r.ok?.85:.08),n:r.text,src:id}}});return P}
function known(b){return probsFrom(S.bought)[b]}
/* evidence-based economics: value of a block on the team's own probabilities, at zero bonus */
const econ=b=>{const x=BLK[b];return{V:x.resourceMMboe*x.valuePerBoe,DH:x.wellCostM,pc:x.pc}};
const emvAt=(b,pg,bonus=0)=>{const e=econ(b);return pg*e.pc*e.V-(1-pg*e.pc)*e.DH-bonus};
const pgP=(P,b)=>SC.elements.reduce((a,e)=>a*P[b][e].p,1);
const bestOf=P=>{let best={b:null,v:0};SC.blocks.forEach(x=>{const v=emvAt(x.id,pgP(P,x.id));if(v>best.v)best={b:x.id,v}});return best};
/* expected value of information: before buying, each element the items test could come back good or bad,
   with probabilities consistent with the current belief (so expected posterior = prior) */
function evoi(items,base=[]){
 const P0=probsFrom(base),pairs=[];let cost=0;
 items.forEach(id=>{const it=SC.dataItems.find(i=>i.id===id);cost+=it.costM;for(const b in it.reveals)for(const e in it.reveals[b]){const r=it.reveals[b][e];let q=pairs.find(x=>x.b===b&&x.e===e);if(!q){q={b,e,pg:.85,pb:.08};pairs.push(q)}if(r.ok)q.pg=r.p??.85;else q.pb=Math.min(q.pb,r.p??.08)}});
 const live=pairs.filter(q=>P0[q.b][q.e].src!=="free"||P0[q.b][q.e].p<q.pg);
 live.forEach(q=>{const pr=P0[q.b][q.e].p;q.q=Math.max(0,Math.min(1,(pr-q.pb)/(q.pg-q.pb)))});
 const v0=bestOf(P0).v;let E=0;const n=live.length;
 for(let m=0;m<(1<<n);m++){let pr=1;const P=JSON.parse(JSON.stringify(P0));live.forEach((q,k)=>{const g=(m>>k)&1;pr*=g?q.q:1-q.q;P[q.b][q.e]={p:g?q.pg:q.pb}});if(pr>0)E+=pr*bestOf(P).v}
 return{gross:E-v0,net:E-v0-cost,cost}}
function bestPackage(){const ids=SC.dataItems.map(i=>i.id);let best={net:-1e9,set:[]};
 for(let m=1;m<(1<<ids.length);m++){const set=ids.filter((_,k)=>(m>>k)&1);const c=set.reduce((a,id)=>a+SC.dataItems.find(i=>i.id===id).costM,0);if(c>SC.dataBudgetM+1e-9)continue;const v=evoi(set);if(v.net>best.net)best={...v,set}}return best}
const cosOf=b=>{const k=known(b);return SC.elements.reduce((a,e)=>a*k[e].p,1)};
const pcls=(p,src)=>!src?"c-unk":p<=.2?"c-bad":p>=.7?"c-ok":"c-mid";
function riskTable(){return `<table class="rt"><tr><th>Block</th>${SC.elements.map(e=>`<th>${e}</th>`).join("")}<th>Pg</th></tr>${SC.blocks.map(b=>{const k=known(b.id);return `<tr><td><b>${b.id}</b></td>${SC.elements.map(e=>`<td class="${pcls(k[e].p,k[e].src)}" title="${esc(k[e].n)}">${Math.round(k[e].p*100)}%</td>`).join("")}<td><b>${Math.round(cosOf(b.id)*100)}%</b></td></tr>`}).join("")}</table><p class="small">Chance each element works. <b>Grey</b> = a regional prior (hover for the reasoning), not evidence · coloured = from data you hold · red ≤ 20% = your data says likely fatal. Pg = product of the five.</p>`}
const flawsFound=()=>SC.blocks.filter(b=>b.fatalFlaw&&known(b.id)[b.fatalFlaw].p<=.2).length;
const totalFlaws=SC.blocks.filter(b=>b.fatalFlaw).length;

/* ---------- synthetic seismic ---------- */
const sq=v=>v*v;
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)/4294967296)}}
const SEIS={
 regional:{title:"Regional dip line R-1: shelf (left) to basin floor (right)",n:34,z0:-24,dz:10,seed:7,
  shape:(x,k)=>{const c=330-k*6;return (60+k*1.5)/(1+Math.exp(-(x-c)/28))+x*.02},
  faults:[{x:70,slope:.42,thr:2,gr:1.1},{x:150,slope:.42,thr:3,gr:1.5},{x:215,slope:.45,thr:2,gr:1.3}],
  diapir:{x:420,w:26,top:120},sands:{},labels:[]},
 shelf:{title:"Line OS-12: across D-9 (left) and D-5 Osprey West (right)",n:30,z0:-20,dz:11,seed:11,
  shape:(x,k)=>x*.05,
  faults:[{x:140,slope:.35,thr:7,gr:0,name:"D-9 fault"},{x:330,slope:.4,thr:20,gr:2,name:"D-5 bounding fault"}],
  bumps:[{x:440,w:85,h:-22,minX:330}],gas:{x:445,w:62,top:24},sands:{12:13},labels:[[100,14,"D-9"],[445,14,"D-5 · gas cloud above"]]},
 osprey:{title:"Line OS-20 through Osprey West, D-5",n:30,z0:-20,dz:11,seed:23,
  shape:(x,k)=>x*.03,
  faults:[{x:160,slope:.4,thr:24,gr:2,name:"bounding fault"}],
  bumps:[{x:270,w:120,h:-24,minX:160}],gas:{x:235,w:48,top:18},sands:{12:12,15:10},labels:[[60,14,"outside the fault"],[300,14,"rollover closure"]]}};
function seisRefl(M,x,hw,clean,A){/* reflector list at trace x; hw = set of fault indices whose hanging wall this pixel is in */
 const refl=[];
 for(let k=0;k<M.n;k++){
  const zb=M.z0+k*M.dz+M.shape(x,k);let z=zb;
  (M.bumps||[]).forEach(b=>{z+=b.h*Math.exp(-sq((x-b.x)/b.w))*(k>1?1:.4)});
  if(M.diapir){const D=M.diapir;if(z>D.top-30)z-=34*Math.exp(-sq((x-D.x)/(D.w*1.6)))}
  M.faults.forEach((f,i)=>{if(hw[i])z+=f.thr+f.gr*k});
  if(M.gas&&!clean)z+=7*Math.exp(-sq((x-M.gas.x)/M.gas.w));
  const lv=(k<2?.4:1)*(.75+.25*Math.sin(x/41+k*1.7)+.12*Math.sin(x/13+k)),th=M.sands[k];
  if(th){refl.push([z,-1.1]);refl.push([z+th,.9])}else refl.push([z,A[k]*lv])}
 return refl}
const faultX=(f,y)=>f.x+y*f.slope;
function seisRender(cv,M,clean){
 const W=600,H=300,ctx=cv.getContext("2d"),img=ctx.createImageData(W,H),d=img.data,R=rng(M.seed),A=[];
 for(let k=0;k<M.n;k++)A.push((k%2?1:-1)*(.35+.3*R()));
 const nz=R,cache={};
 for(let x=0;x<W;x++){
  for(let y=0;y<H;y++){
   const hw=M.faults.map(f=>x>faultX(f,y)),key=hw.map(Number).join("");
   let refl=cache[key];if(!refl||refl.x!==x){refl=seisRefl(M,x,hw,clean,A);refl.x=x;cache[key]=refl}
   let a=0;for(const[z,am]of refl){const u=(y-z)/2.8;if(u>-5&&u<5)a+=am*(1-2*u*u)*Math.exp(-u*u)}
   let n=(nz()+nz()+nz()-1.5)*(clean?.05:.12);
   M.faults.forEach(f=>{const dx=Math.abs(x-faultX(f,y));if(!clean){if(dx<10){a*=.45+dx/18;n+=(nz()-.5)*.55*(1-dx/10)}}else if(dx<1.2)a*=.4});
   if(M.gas&&!clean){const g=Math.exp(-sq((x-M.gas.x)/M.gas.w)),gt=Math.min(1,Math.max(0,(y-M.gas.top)/40));a*=1-.75*g*gt;n+=(nz()-.5)*.75*g*gt}
   if(M.diapir){const D=M.diapir,w=D.w*(1+(y-D.top)/260);if(y>D.top&&Math.abs(x-D.x)<w)a=(nz()-.5)*.5}
   let v=Math.max(-1,Math.min(1,(a+n)*1.9)),i=(y*W+x)*4;
   if(v>=0){d[i]=255-215*v;d[i+1]=255-200*v;d[i+2]=255-95*v}else{v=-v;d[i]=255-80*v;d[i+1]=255-215*v;d[i+2]=255-215*v}
   d[i+3]=255}}
 ctx.putImageData(img,0,0)}
/* geometry probe used by the audit test: depth of a sand top at trace x, on the side of each fault where it actually sits */
function sandTop(M,x,k){let hw=M.faults.map(()=>false);for(let it=0;it<4;it++){const r=seisRefl(M,x,hw,true,Array(M.n).fill(1));let z=r[0][0];let c=0;for(let j=0;j<M.n;j++){if(j===k){z=r[c][0];break}c+=M.sands[j]?2:1}hw=M.faults.map(f=>x>faultX(f,z))}return{z:(()=>{const r=seisRefl(M,x,hw,true,Array(M.n).fill(1));let c=0;for(let j=0;j<k;j++)c+=M.sands[j]?2:1;return r[c][0]})(),hw}}
function seisBox(id,key,clean,overlay=""){const M=SEIS[key];
 return `<div class="seis"><div class="seis-t">${esc(M.title)}${clean?' · <b>reprocessed</b>':' · <b>raw</b>'}</div><div class="seis-w"><canvas id="${id}" width="600" height="300" role="img" aria-label="${esc(M.title)}"></canvas><svg class="seis-o" id="${id}_o" viewBox="0 0 600 300">${M.labels.map(l=>`<text x="${l[0]}" y="${l[1]}" font-size="12" font-weight="700" fill="#14213d" paint-order="stroke" stroke="#fff" stroke-width="3">${l[2]}</text>`).join("")}${overlay}</svg></div><div class="small">${esc(SC.seismicNote)}</div></div>`}
const drawSeis=(id,key,clean)=>{const c=$(id);if(c)seisRender(c,SEIS[key],clean)};

/* ---------- well logs: prognosis vs actual ---------- */
function logPanel(actual){
 const pre=[1,1,1,1],R=rng(5);
 const col=(x0,arr,title)=>{let g=`<text x="${x0}" y="16" font-size="13" font-weight="700" fill="#1d2430">${title}</text>`;
  g+=`<text x="${x0}" y="32" font-size="10" fill="#5b6472">GR</text><text x="${x0+86}" y="32" font-size="10" fill="#5b6472">Lithology</text><text x="${x0+168}" y="32" font-size="10" fill="#5b6472">Resistivity</text>`;
  g+=`<rect x="${x0}" y="38" width="80" height="250" fill="#fff" stroke="#ccc"/><rect x="${x0+86}" y="38" width="76" height="250" fill="#b9b2a6"/><rect x="${x0+168}" y="38" width="80" height="250" fill="#fff" stroke="#ccc"/>`;
  let gr="",rs="";const zone=y=>{const k=Math.floor((y-48)/58);const off=(y-48)-k*58;return k>=0&&k<4&&off<30?k:-1};
  for(let y=38;y<=288;y+=3){const k=zone(y),s=k<0?null:arr[k];const sand=k>=0&&s!==0;
   const gv=sand?22+R()*14:62+R()*16;gr+=(gr?"L":"M")+(x0+gv).toFixed(1)+" "+y;
   const rv=!sand?3:s===1?40:s===.5?18:1.5;const rx=x0+168+Math.min(78,Math.max(2,(Math.log10(rv)+.3)*36+R()*3));rs+=(rs?"L":"M")+rx.toFixed(1)+" "+y}
  arr.forEach((s,k)=>{const y=48+k*58;if(s===0){g+=`<text x="${x0+92}" y="${y+19}" font-size="9" fill="#3a2f22">shale</text>`;return}
   const f=s===1?"#2f7d5b":s===.5?"#d8a45a":"#7fb0d1",l=s===1?"oil sand":s===.5?"thin / gassy":"water sand";
   g+=`<rect x="${x0+86}" y="${y}" width="76" height="30" fill="#e7c995"/><rect x="${x0+86}" y="${y}" width="24" height="30" fill="${f}"/><text x="${x0+113}" y="${y+19}" font-size="9" fill="#1d2430">${l}</text>`});
  return g+`<path d="${gr}" stroke="#2f7d5b" stroke-width="1.6" fill="none"/><path d="${rs}" stroke="#a83232" stroke-width="1.6" fill="none"/>`};
 const pay=a=>a.reduce((t,s)=>t+(s===1?40:s===.5?13:0),0);
 return `<svg viewBox="0 0 560 300" role="img" aria-label="Well logs: pre-drill prognosis compared with what the well found">${col(4,pre,"Pre-drill prognosis")}${col(300,actual,"What the well found")}</svg><p class="small">Net pay: prognosis ~${pay(pre)} ft · actual ~${pay(actual)} ft. GR (green): low in sand. Resistivity (red, log scale): high where pores hold oil or gas.</p>`}

/* ---------- EMV chart ---------- */
function emvChart(V,DH,pc,pgYou,pgCal,bid,rivals){
 const W=600,H=230,L=52,Rr=16,T=16,B=36,xs=b=>L+(W-L-Rr)*b/120,f=(pg,b)=>pg*pc*V-(1-pg*pc)*DH-b;
 const ys=[f(pgYou,0),f(pgYou,120)];if(pgCal!=null)ys.push(f(pgCal,0),f(pgCal,120));ys.push(0);
 let mn=Math.min(...ys),mx=Math.max(...ys);const pad=(mx-mn)*.08||10;mn-=pad;mx+=pad;const yy=v=>T+(H-T-B)*(mx-v)/(mx-mn);
 let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="EMV against signature bonus"><rect width="${W}" height="${H}" fill="#fffdf9"/>`;
 for(let b=0;b<=120;b+=20)g+=`<line x1="${xs(b)}" y1="${T}" x2="${xs(b)}" y2="${H-B}" stroke="#eee6da"/><text x="${xs(b)}" y="${H-B+14}" font-size="10" fill="#5b6472" text-anchor="middle">$${b}M</text>`;
 g+=`<line x1="${L}" y1="${yy(0)}" x2="${W-Rr}" y2="${yy(0)}" stroke="#8d8577"/><text x="${L-6}" y="${yy(0)+3}" font-size="10" fill="#5b6472" text-anchor="end">0</text><text x="${L-6}" y="${yy(mx)+10}" font-size="10" fill="#5b6472" text-anchor="end">+$${Math.round(mx)}M</text><text x="${L-6}" y="${yy(mn)}" font-size="10" fill="#5b6472" text-anchor="end">−$${Math.round(-mn)}M</text>`;
 g+=`<text x="${(L+W)/2}" y="${H-4}" font-size="10" fill="#5b6472" text-anchor="middle">Signature bonus</text>`;
 (rivals||[]).forEach((r,i)=>{if(r.bidM>120)return;g+=`<line x1="${xs(r.bidM)}" y1="${T}" x2="${xs(r.bidM)}" y2="${H-B}" stroke="#9aa4b1" stroke-dasharray="2 3"><title>${esc(r.name)}: $${r.bidM}M</title></line><text x="${xs(r.bidM)+3}" y="${T+10+i*11}" font-size="10" fill="#41506a">${"ABC"[i]} $${r.bidM}M</text>`});
 const line=(pg,st,dash,lab)=>{const be=pg*pc*V-(1-pg*pc)*DH;g+=`<path d="M${xs(0)} ${yy(f(pg,0))} L${xs(120)} ${yy(f(pg,120))}" stroke="${st}" stroke-width="2" fill="none" ${dash?'stroke-dasharray="6 4"':''}/>`;
  if(be>0&&be<120)g+=`<circle cx="${xs(be)}" cy="${yy(0)}" r="4" fill="${st}"><title>${lab} breakeven bonus ≈ $${Math.round(be)}M</title></circle>`;
  for(let b=0;b<=120;b+=10)g+=`<circle cx="${xs(b)}" cy="${yy(f(pg,b))}" r="7" fill="transparent"><title>${lab} at $${b}M bonus: ${f(pg,b)>=0?'+':'−'}$${Math.abs(Math.round(f(pg,b)))}M</title></circle>`};
 line(pgYou,"#c4621d",false,"Your EMV");if(pgCal!=null)line(pgCal,"#14213d",true,"EMV on your risk-table Pg");
 if(bid!=null)g+=`<circle cx="${xs(bid)}" cy="${yy(f(pgYou,bid))}" r="5" fill="#c4621d" stroke="#fff" stroke-width="2"/>`;
 g+=`</svg><div class="legend"><span><i style="background:#c4621d"></i>Your EMV (your Pg)</span>${pgCal!=null?'<span><i class="dash"></i>EMV on your risk-table Pg</span><span><i class="riv"></i>Rival bids</span>':''}</div>`;return g}

async function ask(q,out,ctx){

 if(!sample){out.innerHTML=mentor("The live AI mentor runs in the hosted version of this simulation. Offline, use your advisors and the structured checks; in the pilot, a standalone mentor service answers here using only checked course material.");return}

const PICKS=[
 {id:"edge",ask:"Tap the shelf edge: where the flat shelf reflectors roll over into the slope.",hit:(x,y)=>x>200&&x<330&&y<140,mark:[262,58],ok:"Yes. That rollover is the shelf edge: sand bypasses the shelf here and feeds the slope.",no:"Not quite. The shelf edge is where the flat shelf reflectors roll over and steepen into the slope (marked)."},
 {id:"fault",ask:"Tap a growth fault: a basinward-dipping fault where layers thicken across it.",hit:(x,y)=>SEIS.regional.faults.some(f=>Math.abs(x-(f.x+y*f.slope))<16)&&y<260,mark:[150+120*.42,120],ok:"Good. Layers thicken on the downthrown side: the fault was moving while sediment arrived. Those are your shelf traps.",no:"Look for the faults on the shelf, dipping toward the basin, with thicker layers on their downthrown side (marked)."},
 {id:"diapir",ask:"Tap the shale diapir: the chaotic, reflection-free column that bends the layers up around it.",hit:(x,y)=>Math.abs(x-420)<48&&y>100,mark:[420,190],ok:"Right. Mobile shale rose here and dragged the layers up its flanks. Structures draped on it can focus migration.",no:"The diapir is the chaotic, blank column on the upper slope, with layers dragged up its flanks (marked)."}];

const LEAK=/\b(dry( hole)?|fatal|won'?t work|will not work|doesn'?t work|does not work|fails?|failed|no oil|leaks?|leaked|immature|pinch(es)? out|migrates? away|water[- ]wet|the answer is|is the (only )?(one|block) that works)\b/i;

 say();wireAdv("screen");
 const choose=id=>{recordOwner("screen");lockAdv("screen",id);S.block=id;S.choices.Screen=BLK[id].name;$("vis").querySelector(".basemap").outerHTML=baseMap(false);

   const K=known(id),bad=SC.elements.filter(e=>K[e].p<=.2),open=SC.elements.filter(e=>!K[e].src),v=emvAt(id,cosOf(id)),best=bestOf(probsFrom(S.bought));

/* ---------- 4. Bid: Pg vs Pc, three sealed rivals ---------- */
function stBid(){

 <details class="whyc" style="background:#f7f4ee;border-color:#e3dccd"><summary>Accounting convention</summary><ul class="small">${SC.bid.convention.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>`;

  $("sens").innerHTML=`<table><tr><th>Pg</th><th>Value −25%</th><th>Base value</th><th>Value +25%</th></tr>${[-.1,0,.1].map((d,r)=>`<tr><td>${Math.max(1,Math.round((pg+d)*100))}%${d===0?' (yours)':''}</td>${cells[r].map((c,k)=>`<td${d===0&&k===1?' style="font-weight:700"':''}>${c}</td>`).join("")}</tr>`).join("")}</table><p class="small">Breakeven bonus = the most you could pay and still expect to create value. Ten points of Pg moves it more than a quarter on price.</p>`};

/* ---------- Debrief ---------- */

function qualityParts(){
 const sc=k=>S.score[k],ch=S.challenge?S.challenge.rating:0;
 const parts=[["Data purchase (expected VOI)",sc("data"),3],["Block choice on your evidence",sc("screen"),3],["Bid discipline",sc("bid"),3]];
 if(sc("drill")!=null)parts.push(["Well placement",sc("drill"),3]);
 parts.push(["Post-well decision (economics)",sc("decide"),3],["Reasoning under challenge",ch*1.5,3],["Post-well review",(S.pw||0)*3,3]);

function quality(){const P=qualityParts();return Math.round(100*P.reduce((a,p)=>a+p.v,0)/P.reduce((a,p)=>a+p.max,0))}
function drilledByUs(){return S.bidWon!==false}

function quadrant(q,o){return q>=60?(o>=60?["Good decisions, good outcome","q-gg","Skill and geology lined up. Keep the process; don't credit yourself with the luck."]:["Good decisions, bad outcome","q-gb","Defensible decisions still drill dry holes. That's exploration, not failure."]):(o>=60?["Weaker decisions, good outcome","q-bg","The well worked, but the process wouldn't reliably repeat it. That's luck."]:["Weaker decisions, bad outcome","q-bb","The process created the result. The good news: the process is fixable."])}

  return `You tested ${b}'s ${flaw.toLowerCase()} and the data looked acceptable, yet it failed. That happens: evidence reduces risk, it doesn't remove it. Review whether the test you bought was decisive.`}
 if(S.out.key==="dry"&&S.loc==="L3")return "Right block, but the well went across the bounding fault, outside the closure. The decision that cost you was placement, not prospect selection.";

 if(open.length)return `A discovery, but partly luck: you chose ${b} while its ${open.map(e=>e.toLowerCase()).join(" and ")} ${open.length>1?"were":"was"} still regional priors. ${q>=60?"Most of your process was sound; close that gap and it repeats.":"Next time, test those elements before you bid."}`;

function misunderstandings(){const L=[],K=S.screenKnown||{};
 const bad=SC.elements.filter(e=>K[e]&&K[e].p<=.2);if(bad.length)L.push(`Chose ${S.block} although their own data put its ${bad.join(", ").toLowerCase()} at ${Math.round(K[bad[0]].p*100)}%.`);
 if(S.cos!=null&&S.bidEvidencePg!=null&&Math.abs(S.cos/100-S.bidEvidencePg)>.1)L.push(`Bid on a Pg of ${S.cos}% when their own risk table said ${Math.round(S.bidEvidencePg*100)}%.`);

 if(S.voi&&S.voi.best.net>0&&S.voi.mine.net<.6*S.voi.best.net){const miss=S.voi.best.set.filter(id=>!S.bought.includes(id)).map(id=>lc1(SC.dataItems.find(i=>i.id===id).title));if(miss.length)L.push(`Did not buy ${miss.join(" or ")}, part of the highest-value data package.`)}

function overlooked(){const K=S.screenKnown||{};return SC.elements.filter(e=>K[e]&&!K[e].src).map(e=>{const t=cheapestTest(S.block,e);return `${S.block} ${e.toLowerCase()} was a ${Math.round(K[e].p*100)}% regional prior${t?`; testable with the ${t.short||lc1(t.title)} ($${t.costM}M)`:"; no data in the room tested it"}.`})}
function voiRows(){const ids=SC.dataItems.map(i=>i.id);

 <div class="iv-screen" role="region" aria-label="Narrated briefing">
  <div class="iv-left"><div class="face iv-face" id="ivFace">${face(COACH.id)}</div><div class="iv-name"><b>${esc(COACH.name)}</b><span>${esc(COACH.role)}</span></div></div>
  <div class="iv-right"><div class="iv-chap" id="ivChap"></div><h2 id="ivTitle"></h2><ul id="ivList"></ul></div>
  <div class="iv-cap" id="ivCap" aria-live="polite"></div>
 </div>
 <div class="iv-bar"><div class="iv-prog"><div id="ivProg"></div></div>
  <div class="iv-ctrl"><button id="ivPlay">Pause</button><button id="ivPrev" aria-label="Previous">‹ Back</button><button id="ivNext" aria-label="Next">Next ›</button><button id="ivVoice">${S.voice?"Voice: on":"Voice: off"}</button><span class="iv-dots" id="ivDots"></span><button class="primary" id="ivSkip">Skip to team setup</button></div></div></div>`;
 document.body.appendChild(ov);
 let i=0,playing=true,timer=null,tok=0;
 const dots=()=>{$("ivDots").innerHTML=segs.map((s,k)=>`<button class="iv-dot ${k===i?'on':''}" data-k="${k}" aria-label="${esc(s.title)}"></button>`).join("");document.querySelectorAll(".iv-dot").forEach(b=>b.onclick=()=>show(+b.dataset.k))};
 const end=()=>{stopAll();clearTimeout(timer);ov.classList.add("leaving");setTimeout(()=>{ov.remove();go(0)},300)};
 function show(k){clearTimeout(timer);stopAll();tok++;const my=tok;i=k;const s=segs[i];
  $("ivChap").textContent=`${i+1} / ${segs.length}`;$("ivTitle").textContent=s.title;
  $("ivList").innerHTML=s.bullets.map((b,j)=>`<li style="animation-delay:${.15+j*.35}s">${esc(b)}</li>`).join("");
  $("ivCap").textContent=s.say;$("ivProg").style.width=((i+1)/segs.length*100)+"%";dots();
  $("ivNext").textContent=i===segs.length-1?"Start ›":"Next ›";
  if(!playing)return;
  const adv=()=>{if(my!==tok||!playing)return;if(i<segs.length-1)show(i+1);else timer=setTimeout(end,900)};
  const minMs=s.say.split(" ").length*300,t0=Date.now();
  if(S.voice&&"speechSynthesis" in window){const L=[{t:s.say,who:COACH.id,el:"ivFace"}];L.done=()=>{if(my!==tok)return;timer=setTimeout(adv,Math.max(0,minMs-(Date.now()-t0))+700)};speakQ(L)}
  else{anim("ivFace",true);const ms=Math.max(4000,s.say.split(" ").length*380);setTimeout(()=>anim("ivFace",false),Math.min(ms,6000));timer=setTimeout(adv,ms)}}
 $("ivPlay").onclick=()=>{playing=!playing;$("ivPlay").textContent=playing?"Pause":"Play";if(playing)show(i);else{clearTimeout(timer);stopAll();tok++}};
 $("ivPrev").onclick=()=>show(Math.max(0,i-1));
 $("ivNext").onclick=()=>{if(i===segs.length-1)end();else show(i+1)};
 $("ivSkip").onclick=end;
 $("ivVoice").onclick=()=>{S.voice=!S.voice;$("ivVoice").textContent=S.voice?"Voice: on":"Voice: off";$("voiceBtn").textContent="Voices: "+(S.voice?"on":"off");show(i)};
 show(0);
}

stCover();
</script>
</body>
</html>
